services:
  # FastAPI Backend
  api:
    build: .
    container_name: dataagent-api
    ports:
      # Bind to loopback only. Publishing 8002 on all interfaces exposed the
      # API directly, bypassing nginx's TLS termination and its rate_limit
      # zone — and the "first registrant becomes admin" rule then handed
      # admin to whoever reached the port first.
      - "127.0.0.1:8002:8002"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./outputs:/app/outputs
      # Config is mounted read-only in production: the app reads
      # settings.yaml + llm_runtime.json but must never write secrets
      # back into the host checkout from inside the container.
      - ./config:/app/config:ro
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8002
      - DUCKDB_DATABASE_PATH=data/curated/warehouse.duckdb
      # Fail fast with a clear message instead of booting with a forgeable key.
      # Generate: python -c "import secrets;print(secrets.token_hex(32))"
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      - API_CORS_ORIGINS=${API_CORS_ORIGINS:-}
      # Host-header validation (DNS-rebinding guard). Override with the real
      # hostname when deploying behind a domain.
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-localhost,127.0.0.1,web}
      # Bootstrap admin: the first account may be created without a token
      # only when this is set. Leaving it empty means nobody can register
      # the first admin account, and an admin must be created explicitly.
      - DATAAGENT_BOOTSTRAP_TOKEN=${DATAAGENT_BOOTSTRAP_TOKEN:-}
    networks:
      - appnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Nginx Reverse Proxy (serves static files + proxies API)
  web:
    image: nginx:alpine
    container_name: dataagent-web
    ports:
      - "80:80"
      # Uncomment after scripts/enable_tls.ps1 provisions a cert:
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
      # Certbot certs when TLS is enabled (see scripts/enable_tls.ps1):
      # - certs:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - appnet
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 (not localhost): nginx `listen 80` binds IPv4 only, and
      # localhost can resolve to ::1 inside the container -> refused.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Ollama for local LLM
  ollama:
    image: ollama/ollama:latest
    container_name: dataagent-llm
    profiles:
      - full
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - appnet
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  appnet:
    driver: bridge

volumes:
  ollama_data:
  # Uncomment with the certs volume mount above after enable_tls.ps1:
  # certs:
