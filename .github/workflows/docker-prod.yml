name: docker-prod
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  build-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build (prod image)
        run: docker build -t dataagent:${{ github.sha }} .
      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: dataagent:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy.sarif
      - name: Compose config check
        run: |
          cp .env.example .env
          python -c "import secrets;print(secrets.token_hex(32))" > /tmp/jwt.txt
          JWT_SECRET=$(cat /tmp/jwt.txt) docker compose config > /dev/null
          echo "compose config OK"
