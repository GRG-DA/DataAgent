name: build-windows
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt
          pip install pyinstaller
      - name: Packaging tests (version/icon/anti-crack)
        run: python -m pytest tests/test_packaging.py tests/test_exe_release.py -q
      - name: Build exes (no sign on CI unless secrets present)
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1
        env:
          DATAAENT_CODESIGN_IDENTITY: ""
      - name: Checksums
        if: always()
        run: |
          Get-ChildItem dist -Recurse | Select-Object FullName, Length
          if (Test-Path dist/SHA256SUMS.txt) { Get-Content dist/SHA256SUMS.txt }
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/DataAgent.exe
            dist/DataAgentShell/
            dist/DataAgent-Setup.exe
            dist/SHA256SUMS.txt
