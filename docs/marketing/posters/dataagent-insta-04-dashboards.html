<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DataAgent — IG carousel 04: Auto-built dashboards</title>
<link rel="stylesheet" href="assets/poster-base.css">
<style>
  .eyebrow { top:152px; }
  .headline { top:188px; }
  .sub { top:404px; width:920px; }

  .tabbar {
    position:absolute; left:96px; top:452px; width:888px; height:44px;
    background:#0D1226; border-radius:18px 18px 0 0;
    display:flex; align-items:center; gap:9px; padding:0 20px;
    box-shadow:0 30px 70px rgba(23,43,90,.16);
  }
  .dotx { width:12px; height:12px; border-radius:50%; }
  .tabbar .title { margin-left:14px; color:#8FA0C9; font-size:16px; font-weight:600; letter-spacing:.06em; }
  .dotx.x1 { background:#FF5F57; } .dotx.x2 { background:#FEBC2E; } .dotx.x3 { background:#28C840; }

  .panel.shot {
    left:96px; top:496px; width:888px; padding:0;
    border-radius:0 0 24px 24px; overflow:hidden;
  }
  .panel.shot img { width:100%; }

  .float-kpi { left:660px; top:474px; width:330px; padding:16px 22px 18px; }
  .kpi-label { font-size:14px; font-weight:600; color:#8894B4; letter-spacing:.06em; }
  .kpi-value { font-size:40px; font-weight:800; color:#0E1633; letter-spacing:-0.02em; line-height:1; margin-top:3px; }
  .kpi-bars { display:flex; align-items:flex-end; gap:9px; height:46px; margin-top:12px; }
  .kpi-bars .bar { width:30px; border-radius:6px 6px 2px 2px;
    background:linear-gradient(180deg,#7AA0FF 0%,#2E63E8 100%); }
  .kpi-bars .b1 { height:22px; opacity:.55; } .kpi-bars .b2 { height:29px; opacity:.75; }
  .kpi-bars .b3 { height:46px; } .kpi-bars .b4 { height:26px; opacity:.6; } .kpi-bars .b5 { height:15px; opacity:.4; }

  .float-note { left:24px; top:560px; width:280px; padding:14px 20px; display:flex; gap:11px; align-items:center; }
  .float-note .ic {
    width:34px; height:34px; border-radius:10px; flex:0 0 34px;
    background:linear-gradient(135deg,#E3EBFF,#F2F6FF); border:1px solid rgba(46,99,232,.25);
    display:flex; align-items:center; justify-content:center; font-size:17px; color:#2E63E8; font-weight:700;
  }
  .float-note .t1 { font-size:18px; font-weight:700; color:#0E1633; line-height:1.2; }
  .float-note .t2 { font-size:14px; color:#59668C; }

  .ribbon { position:absolute; pointer-events:none; }
</style>
</head>
<body>
<div class="stage">

  <div class="brand">
    <div class="brand-tile">DA</div>
    <div>
      <div class="brand-name">DataAgent</div>
      <div class="brand-sub">Local-first analytics</div>
    </div>
  </div>
  <div class="pageno">04 / 06</div>

  <div class="eyebrow">DASHBOARDS</div>
  <div class="headline">Dashboards that<br>build themselves.</div>

  <div class="sub">Import a file — KPI cards, trends, and breakdowns laid out for you.</div>

  <div class="tabbar">
    <span class="dotx x1"></span><span class="dotx x2"></span><span class="dotx x3"></span>
    <span class="title">DATAAGENT — DASHBOARD</span>
  </div>
  <div class="panel shot"><img src="assets/dashboard-crop.png" alt="DataAgent dashboard"></div>

  <div class="card float-kpi">
    <div class="kpi-label">TOTAL REVENUE</div>
    <div class="kpi-value">240K</div>
    <div class="kpi-bars">
      <div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div>
      <div class="bar b4"></div><div class="bar b5"></div>
    </div>
  </div>

  <div class="card float-note">
    <div class="ic">✎</div>
    <div>
      <div class="t1">Everything editable</div>
      <div class="t2">KPI cards, charts and filters in the app</div>
    </div>
  </div>

</div>
</body>
</html>
