<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DataAgent — Vertical End Card (1080×1920)</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #070707; }
  .card {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background:
      radial-gradient(900px 620px at 50% 16%, rgba(193,193,193,.10), transparent 62%),
      radial-gradient(760px 520px at 50% 102%, rgba(123,123,123,.09), transparent 62%),
      #070707;
    font-family: "Segoe UI", Inter, Arial, sans-serif;
    color: #f4f4f4;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 72px 72px;
    -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 74%);
    mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 74%);
  }
  .safe {
    position: absolute;
    left: 90px; right: 90px;
    top: 260px; bottom: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .mark {
    width: 132px; height: 132px;
    border-radius: 34px;
    background: linear-gradient(120deg, #585858 0%, #676767 100%);
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 24px 70px rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center;
    font-size: 54px; font-weight: 800; letter-spacing: -2px; color: #fff;
  }
  .brand { margin-top: 28px; font-size: 40px; font-weight: 700; letter-spacing: -.5px; }
  .pill {
    margin-top: 20px;
    padding: 12px 24px;
    border: 1px solid #2f2f2f;
    border-radius: 999px;
    background: #0d0d0d;
    color: #c1c1c1;
    font-size: 24px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  h1 {
    margin: 62px 0 0;
    font-size: 88px;
    line-height: 1.02;
    letter-spacing: -4px;
    font-weight: 800;
  }
  h1 .dim { color: #9d9d9d; font-weight: 500; }
  .sub {
    margin-top: 30px;
    font-size: 44px;
    line-height: 1.3;
    color: #c1c1c1;
    font-weight: 400;
  }
  .url {
    margin-top: 62px;
    padding: 26px 44px;
    border: 1px solid #3a3a3a;
    border-radius: 999px;
    background: #0d0d0d;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
    font-size: 42px;
    font-weight: 600;
    letter-spacing: .3px;
  }
  .url .slash { color: #868686; font-weight: 400; }
  .foot {
    position: absolute;
    left: 90px; right: 90px; bottom: 505px;
    display: flex; justify-content: center; align-items: center;
    gap: 22px;
    font-size: 28px;
    color: #868686;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #4a4a4a; }
</style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <div class="safe">
      <div class="mark">DA</div>
      <div class="brand">DataAgent</div>
      <div class="pill">CSV → Real .pbix</div>
      <h1>Free Windows<br><span class="dim">download</span></h1>
      <div class="sub">14-day Pro trial, no card.</div>
      <div class="url">data-agent.me<span class="slash">/download</span></div>
    </div>
    <div class="foot">
      <span>Windows 10/11 x64</span>
      <span class="dot"></span>
      <span>About 440 MB</span>
      <span class="dot"></span>
      <span>No card</span>
    </div>
  </div>
</body>
</html>
