<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DataAgent — YouTube Thumbnail (1280×720)</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #070707; }
  .thumb {
    position: relative;
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background:
      radial-gradient(700px 420px at 28% 40%, rgba(193,193,193,.12), transparent 64%),
      radial-gradient(600px 380px at 92% 90%, rgba(123,123,123,.10), transparent 62%),
      #070707;
    font-family: "Segoe UI", Inter, Arial, sans-serif;
    color: #f4f4f4;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 62px 62px;
    -webkit-mask-image: radial-gradient(circle at 40% 46%, #000 0%, transparent 78%);
    mask-image: radial-gradient(circle at 40% 46%, #000 0%, transparent 78%);
  }
  .bars {
    position: absolute; right: 64px; bottom: 76px;
    display: flex; align-items: flex-end; gap: 18px;
    opacity: .28;
  }
  .bars i { display: block; width: 44px; border-radius: 8px 8px 0 0; background: #c1c1c1; }
  .bars i:nth-child(1) { height: 90px; }
  .bars i:nth-child(2) { height: 150px; }
  .bars i:nth-child(3) { height: 120px; }
  .bars i:nth-child(4) { height: 220px; }
  .bars i:nth-child(5) { height: 280px; }
  .top {
    position: absolute; left: 64px; top: 46px; right: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .mark {
    width: 60px; height: 60px; border-radius: 16px;
    background: linear-gradient(120deg, #585858, #676767);
    border: 1px solid rgba(255,255,255,.14);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800; letter-spacing: -1px;
  }
  .name { font-size: 26px; font-weight: 700; }
  .win {
    padding: 10px 18px;
    border: 1px solid #2f2f2f; border-radius: 999px;
    background: #0d0d0d;
    font-size: 18px; color: #c1c1c1; letter-spacing: 1px; text-transform: uppercase;
  }
  .flow {
    position: absolute; left: 62px; top: 186px;
    display: flex; align-items: center; gap: 22px;
    font-size: 150px; font-weight: 800; letter-spacing: -7px; line-height: 1;
  }
  .flow .csv { color: #f4f4f4; }
  .flow .arrow { color: #7b7b7b; font-weight: 400; letter-spacing: 0; font-size: 116px; }
  .flow .pbix {
    padding: 6px 26px 14px;
    border: 4px solid #c1c1c1; border-radius: 20px;
    color: #f4f4f4;
  }
  .headline {
    position: absolute; left: 66px; top: 380px;
    font-size: 46px; line-height: 1.18; font-weight: 600; letter-spacing: -1px;
    color: #d6d6d6;
  }
  .headline .dim { color: #868686; font-weight: 400; }
  .chips {
    position: absolute; left: 66px; bottom: 68px;
    display: flex; gap: 14px;
  }
  .chip {
    padding: 12px 20px;
    border: 1px solid #2f2f2f; border-radius: 999px;
    background: #0d0d0d;
    font-size: 20px; color: #bdbdbd;
  }
  .accent {
    position: absolute; left: 0; top: 0; bottom: 0; width: 10px;
    background: linear-gradient(#3a3a3a, #7b7b7b, #3a3a3a);
    opacity: .55;
  }
</style>
</head>
<body>
  <div class="thumb">
    <div class="grid"></div>
    <div class="accent"></div>
    <div class="top">
      <div class="brand">
        <div class="mark">DA</div>
        <div class="name">DataAgent</div>
      </div>
      <div class="win">Windows 10/11 x64</div>
    </div>
    <div class="flow">
      <span class="csv">CSV</span>
      <span class="arrow">→</span>
      <span class="pbix">.PBIX</span>
    </div>
    <div class="headline">One question.<br><span class="dim">A real Power BI file.</span></div>
    <div class="chips">
      <div class="chip">Local AI</div>
      <div class="chip">SQL visible</div>
      <div class="chip">Local-first by design</div>
    </div>
    <div class="bars"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
</body>
</html>
