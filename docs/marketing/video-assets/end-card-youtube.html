<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DataAgent — YouTube End Card (1920×1080)</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #070707; }
  .card {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background:
      radial-gradient(1100px 720px at 22% 38%, rgba(193,193,193,.10), transparent 62%),
      radial-gradient(800px 600px at 96% 90%, rgba(123,123,123,.08), transparent 60%),
      #070707;
    font-family: "Segoe UI", Inter, Arial, sans-serif;
    color: #f4f4f4;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 80px 80px;
    -webkit-mask-image: radial-gradient(circle at 30% 50%, #000 0%, transparent 72%);
    mask-image: radial-gradient(circle at 30% 50%, #000 0%, transparent 72%);
  }
  .content {
    position: absolute;
    left: 140px; top: 150px; bottom: 150px;
    width: 1040px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .top { display: flex; align-items: center; gap: 22px; }
  .mark {
    width: 88px; height: 88px; border-radius: 24px;
    background: linear-gradient(120deg, #585858, #676767);
    border: 1px solid rgba(255,255,255,.14);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 800; letter-spacing: -1.5px;
  }
  .brand { font-size: 34px; font-weight: 700; letter-spacing: -.3px; }
  h1 {
    margin: 64px 0 0;
    font-size: 96px; line-height: 1.02; letter-spacing: -4px; font-weight: 800;
  }
  h1 .dim { color: #9d9d9d; font-weight: 500; }
  .sub { margin-top: 26px; font-size: 44px; color: #c1c1c1; }
  .row { margin-top: 56px; display: flex; align-items: center; gap: 26px; }
  .url {
    padding: 22px 38px;
    border: 1px solid #3a3a3a; border-radius: 999px;
    background: #0d0d0d;
    font-size: 38px; font-weight: 600;
  }
  .url .slash { color: #868686; font-weight: 400; }
  .note { font-size: 28px; color: #868686; line-height: 1.5; }
  .divider {
    position: absolute; left: 1260px; top: 150px; bottom: 150px;
    width: 1px; background: linear-gradient(transparent, #2a2a2a 20%, #2a2a2a 80%, transparent);
  }
  .right {
    position: absolute; left: 1320px; right: 140px; top: 150px; bottom: 150px;
    background: radial-gradient(400px 300px at 50% 50%, rgba(123,123,123,.05), transparent 70%);
    border-radius: 28px;
  }
  .foot {
    position: absolute; left: 140px; bottom: 96px;
    font-size: 26px; color: #868686;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <div class="content">
      <div class="top">
        <div class="mark">DA</div>
        <div class="brand">DataAgent</div>
      </div>
      <h1>Free Windows<br><span class="dim">download</span></h1>
      <div class="sub">14-day Pro trial, no card.</div>
      <div class="row">
        <div class="url">data-agent.me<span class="slash">/download</span></div>
        <div class="note">Windows 10/11 x64<br>About 440 MB · No card</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="right"></div>
    <div class="foot">Local AI data analyst for Windows. CSV → real .pbix.</div>
  </div>
</body>
</html>
