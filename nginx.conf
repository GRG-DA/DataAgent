# DataAgent public reverse-proxy.
# HTTP serves ACME challenges + redirects to HTTPS when TLS is configured.
# For TLS: place fullchain.pem/privkey.pem (e.g. via certbot) and uncomment
# the 443 server block below, then set server_name to your domain.
#
# ⚠ This file fronts the APP (the FastAPI API + the web SPA), NOT the
#   marketing site. The marketing site is a separate static deployment with
#   its own headers (website/_headers, website/netlify.toml,
#   website/vercel.json). The two must not borrow each other's policy: they
#   are different origins with different needs.

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # ── Security headers ────────────────────────────────────────────────
    # Baseline hardening on static responses (the API sets its own CSP).
    #
    # HSTS is deliberately NOT sent from this block: it listens on plain
    # HTTP. A browser ignores Strict-Transport-Security over HTTP, and
    # sending it anyway pins a host that may not speak TLS yet. It lives in
    # the commented-out 443/TLS block at the bottom of this file, where it
    # is only ever sent over TLS.
    #
    # There is deliberately NO Content-Security-Policy at this level. The
    # FastAPI app sets its own CSP on every response it produces
    # (api/main.py::_no_cache_dev_assets), and a browser enforces the
    # INTERSECTION of two CSPs. A second, stricter policy here would
    # silently break the app: the Google-OAuth popup needs frame-src, and
    # the SSE chat stream needs connect-src. The app's CSP is declared once,
    # in `location /` below, and the proxied locations pass the API's own
    # CSP through untouched.
    #
    # NOTE (nginx add_header inheritance): a location block that declares
    # its own add_header does NOT inherit the server-level ones. `location /`
    # declares `Cache-Control`, so it repeats the whole set below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # The SPA's own policy. It mirrors the one FastAPI applies
        # (api/main.py::_no_cache_dev_assets) so the app behaves the same
        # whether it is served by nginx or by uvicorn:
        #   - 'unsafe-inline' for scripts and styles: the SPA injects page
        #     scripts and uses inline handlers;
        #   - https: in script/style/img/font: the notebook page and the SQL
        #     editor load their own assets from a CDN;
        #   - connect-src allows https:/ws:/wss: for cloud LLM providers
        #     and the local Ollama/LM Studio endpoints;
        #   - frame-src allows the Google OAuth popup and its handler.
        # It is NOT the marketing site's policy: that one is far stricter
        # because the marketing site loads nothing but its own files.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' http://localhost:* http://127.0.0.1:* https: ws: wss:; frame-src 'self' https://*.googleapis.com https://accounts.google.com https://*.accounts.google.com https://apis.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=3600";
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8002/health;
        proxy_set_header Host $host;
    }

    location /llm/chat/stream {
        proxy_pass http://api:8002/llm/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}

