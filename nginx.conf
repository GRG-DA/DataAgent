# DataAgent public reverse-proxy.
# HTTP serves ACME challenges + redirects to HTTPS when TLS is configured.
# For TLS: place fullchain.pem/privkey.pem (e.g. via certbot) and uncomment
# the 443 server block below, then set server_name to your domain.

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # Baseline hardening on static responses (API sets its own CSP).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8002/health;
        proxy_set_header Host $host;
    }

    location /llm/chat/stream {
        proxy_pass http://api:8002/llm/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}

