<!doctype html>
<!--
  The source of website/og-image.png - the social card every shared link
  carries.

  It is rendered in a real browser, with the site's OWN vendored fonts and
  the site's OWN palette, so the card cannot drift from the page it
  represents.  Regenerate it with:

      python scripts/site_og_card.py

  The palette below is the monochrome one: every value is a true neutral
  (R = G = B), and the four STATUS hues are the only colours on the site.
  The social card is not the place to reintroduce one.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>DataAgent social card</title>
<link rel="stylesheet" href="../website/css/fonts.css">
<style>
  :root {
    --surface:      #070707;
    --text:         #f4f4f4;
    --text-2:       #b1b1b1;
    --text-muted:   #868686;
    --primary-hi:   #9d9d9d;
    --line:         rgba(255, 255, 255, 0.09);
    --line-2:       rgba(255, 255, 255, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--surface);
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
    color: var(--text);
  }

  /* the technical lattice, masked so it dissolves at the edges */
  .lattice {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(242, 242, 243, 0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(242, 242, 243, 0.055) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 20%, transparent 80%);
            mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 20%, transparent 80%);
  }

  /* one soft grey core, the way the hero's aurora reads */
  .aurora {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 26% 32%,
      rgba(123, 123, 123, 0.42), rgba(186, 186, 186, 0.10) 52%, transparent 72%);
  }

  /* the readability veil */
  .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(5, 5, 5, 0.46) 0%, rgba(5, 5, 5, 0.04) 30%,
      rgba(5, 5, 5, 0.16) 66%, rgba(5, 5, 5, 0.48) 100%);
  }

  /* the film grain the site carries over everything */
  .grain {
    position: absolute; inset: 0;
    opacity: 0.5;
    mix-blend-mode: soft-light;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
  }

  .body {
    position: relative;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 38px;
  }

  /* the brand mark: a 2x2 grid of rounded squares */
  .mark {
    width: 62px; height: 62px;
    border-radius: 16px;
    background: #121212;
    border: 1px solid var(--line);
    padding: 9px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 6px;
  }
  .mark i { display: block; }
  .mark i:nth-child(1) { background: #585858; border-radius: 8px; }
  .mark i:nth-child(2) { background: #a2a2a2; border-radius: 13px; }
  .mark i:nth-child(3) { background: #c1c1c1; border-radius: 13px; }
  .mark i:nth-child(4) { background: #ececec; border-radius: 8px; }

  .wordmark {
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    font-weight: 800;
    font-size: 44px;
    letter-spacing: -0.028em;
    color: var(--text);
  }

  /* the hairline that used to be the violet-cyan gradient */
  .rule {
    width: 168px;
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(90deg, #585858 0%, #c1c1c1 100%);
    margin-bottom: 30px;
  }

  h1 {
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    font-weight: 800;
    font-size: 72px;
    line-height: 1;
    letter-spacing: -0.035em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--text);
  }

  .sub {
    margin-top: 26px;
    font-size: 27px;
    line-height: 1.5;
    font-weight: 500;
    color: var(--text-2);
    max-width: 940px;
  }

  .pills {
    margin-top: auto;
    display: flex;
    gap: 16px;
  }
  .pill {
    border: 1px solid var(--line-2);
    border-radius: 999px;
    padding: 9px 22px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text-2);
    background: rgba(255, 255, 255, 0.03);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="lattice"></div>
    <div class="aurora"></div>
    <div class="scrim"></div>
    <div class="grain"></div>

    <div class="body">
      <div class="brand">
        <div class="mark"><i></i><i></i><i></i><i></i></div>
        <div class="wordmark">DataAgent</div>
      </div>

      <div class="rule"></div>

      <h1>Where your data lives.</h1>

      <p class="sub">
        Ask questions in plain language. Build dashboards.<br>
        Export to Power BI. Everything stays on your machine.
      </p>

      <div class="pills">
        <div class="pill">Local-first desktop app</div>
        <div class="pill">No telemetry</div>
        <div class="pill">Windows .exe</div>
      </div>
    </div>
  </div>
</body>
</html>
